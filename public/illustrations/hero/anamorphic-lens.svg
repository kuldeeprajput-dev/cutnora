<svg viewBox="0 0 460 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Lens Barrel Cylinders -->
    <rect x="70" y="110" width="130" height="210" rx="8"/>
    <rect x="195" y="130" width="110" height="170" rx="4" stroke-dasharray="3 3"/>
    <rect x="300" y="145" width="80" height="140" rx="4"/>
    <rect x="375" y="160" width="30" height="110" rx="2" stroke-width="1.5"/>

    <!-- Front Lens Element Glass Bulge -->
    <path d="M70 120 C45 150, 45 280, 70 310" stroke-width="1.8"/>
    <path d="M60 140 C45 170, 45 250, 60 280" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Iris / Aperture 9-Blade Geometry -->
    <polygon points="135,175 165,190 155,225 120,235 105,200" stroke-width="1.5"/>
    <line x1="135" y1="175" x2="185" y2="180"/>
    <line x1="165" y1="190" x2="175" y2="240"/>
    <line x1="155" y1="225" x2="110" y2="250"/>
    <line x1="120" y1="235" x2="85" y2="210"/>
    <line x1="105" y1="200" x2="115" y2="160"/>

    <!-- Follow Focus Gear Rings -->
    <line x1="100" y1="110" x2="100" y2="320" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="155" y1="110" x2="155" y2="320" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="230" y1="130" x2="230" y2="300" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="270" y1="130" x2="270" y2="300" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Precision Measurement Ticks -->
    <line x1="195" y1="140" x2="205" y2="140" stroke-width="2"/>
    <line x1="195" y1="155" x2="212" y2="155" stroke-width="2"/>
    <line x1="195" y1="170" x2="205" y2="170" stroke-width="2"/>
    <line x1="195" y1="185" x2="212" y2="185" stroke-width="2"/>
    <line x1="195" y1="200" x2="205" y2="200" stroke-width="2"/>
    <line x1="195" y1="215" x2="220" y2="215" stroke-width="2.5"/>
    <line x1="195" y1="230" x2="205" y2="230" stroke-width="2"/>
    <line x1="195" y1="245" x2="212" y2="245" stroke-width="2"/>
    <line x1="195" y1="260" x2="205" y2="260" stroke-width="2"/>
    <line x1="195" y1="275" x2="212" y2="275" stroke-width="2"/>

    <!-- 50mm T1.5 Engraving Mock -->
    <text x="320" y="220" fill="currentColor" font-family="monospace" font-size="11" letter-spacing="0.1em" opacity="0.7">
      50mm T1.5
    </text>
  </g>
</svg>
