<svg viewBox="0 0 520 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera Top Plate Contour -->
    <path d="M80 260 L80 180 Q80 160 100 160 L180 160 L205 130 L315 130 L340 160 L420 160 Q440 160 440 180 L440 260 Z" stroke-width="1.8"/>

    <!-- Viewfinder Prism / Hot Shoe -->
    <rect x="225" y="105" width="70" height="28" rx="3"/>
    <rect x="238" y="93" width="44" height="14" rx="2" stroke-width="1.5"/>

    <!-- Left Mode Dial Wheel -->
    <ellipse cx="140" cy="155" rx="32" ry="14"/>
    <line x1="110" y1="155" x2="110" y2="170"/>
    <line x1="170" y1="155" x2="170" y2="170"/>
    <path d="M110 170 Q140 182 170 170"/>
    <!-- Dial Ridges -->
    <line x1="120" y1="157" x2="120" y2="169" stroke-dasharray="1 2"/>
    <line x1="130" y1="160" x2="130" y2="171" stroke-dasharray="1 2"/>
    <line x1="140" y1="161" x2="140" y2="172" stroke-dasharray="1 2"/>
    <line x1="150" y1="160" x2="150" y2="171" stroke-dasharray="1 2"/>
    <line x1="160" y1="157" x2="160" y2="169" stroke-dasharray="1 2"/>

    <!-- Right Shutter Button & Exposure Comp Dial -->
    <ellipse cx="380" cy="155" rx="30" ry="13"/>
    <line x1="352" y1="155" x2="352" y2="168"/>
    <line x1="408" y1="155" x2="408" y2="168"/>
    <path d="M352 168 Q380 180 408 168"/>

    <!-- Secondary Shutter & Front Wheel -->
    <rect x="410" y="180" width="22" height="40" rx="4"/>
    <circle cx="421" cy="195" r="7" stroke-width="1.5"/>

    <!-- Top LCD Status Display -->
    <rect x="180" y="185" width="160" height="60" rx="6" stroke-dasharray="4 2"/>
    <text x="192" y="212" fill="currentColor" font-family="monospace" font-size="10" letter-spacing="0.1em" opacity="0.8">
      ISO 800  1/50
    </text>
    <text x="192" y="232" fill="currentColor" font-family="monospace" font-size="10" letter-spacing="0.1em" opacity="0.8">
      f/2.8  LOG-3
    </text>
  </g>
  <!-- Subtle stipple clusters -->
  <g fill="currentColor" opacity="0.4">
    <circle cx="95" cy="195" r="1.2"/>
    <circle cx="105" cy="195" r="1.2"/>
    <circle cx="115" cy="195" r="1.2"/>
    <circle cx="95" cy="205" r="1.2"/>
    <circle cx="105" cy="205" r="1.2"/>
    <circle cx="115" cy="205" r="1.2"/>
    <circle cx="95" cy="215" r="1.2"/>
    <circle cx="105" cy="215" r="1.2"/>
    <circle cx="115" cy="215" r="1.2"/>
  </g>
</svg>
