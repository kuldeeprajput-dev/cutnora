<svg viewBox="0 0 240 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Channel Labels -->
    <text x="24" y="16" fill="currentColor" font-family="monospace" font-size="8">CH 1</text>
    <text x="74" y="16" fill="currentColor" font-family="monospace" font-size="8">CH 2</text>
    <text x="124" y="16" fill="currentColor" font-family="monospace" font-size="8">CH 3</text>
    <text x="175" y="16" fill="currentColor" font-family="monospace" font-size="8">MST</text>

    <!-- Fader 1 -->
    <line x1="36" y1="26" x2="36" y2="105" stroke-width="1.5"/>
    <rect x="28" y="52" width="16" height="11" rx="2" stroke-width="1.2"/>
    <line x1="28" y1="57" x2="44" y2="57" stroke-width="0.8"/>

    <!-- Fader 2 -->
    <line x1="86" y1="26" x2="86" y2="105" stroke-width="1.5"/>
    <rect x="78" y="42" width="16" height="11" rx="2" stroke-width="1.2"/>
    <line x1="78" y1="47" x2="94" y2="47" stroke-width="0.8"/>

    <!-- Fader 3 -->
    <line x1="136" y1="26" x2="136" y2="105" stroke-width="1.5"/>
    <rect x="128" y="68" width="16" height="11" rx="2" stroke-width="1.2"/>
    <line x1="128" y1="73" x2="144" y2="73" stroke-width="0.8"/>

    <!-- Master Stereo Segmented Meter -->
    <rect x="178" y="26" width="8" height="79" rx="2"/>
    <rect x="190" y="26" width="8" height="79" rx="2"/>

    <!-- Segment ticks -->
    <line x1="179" y1="32" x2="185" y2="32" stroke-width="1"/>
    <line x1="191" y1="32" x2="197" y2="32" stroke-width="1"/>
    <line x1="179" y1="41" x2="185" y2="41" stroke-width="1"/>
    <line x1="191" y1="41" x2="197" y2="41" stroke-width="1"/>
    <line x1="179" y1="50" x2="185" y2="50" stroke-width="1"/>
    <line x1="191" y1="50" x2="197" y2="50" stroke-width="1"/>
    <line x1="179" y1="59" x2="185" y2="59" stroke-width="1"/>
    <line x1="191" y1="59" x2="197" y2="59" stroke-width="1"/>
    <line x1="179" y1="68" x2="185" y2="68" stroke-width="1"/>
    <line x1="191" y1="68" x2="197" y2="68" stroke-width="1"/>
    <line x1="179" y1="77" x2="185" y2="77" stroke-width="1"/>
    <line x1="191" y1="77" x2="197" y2="77" stroke-width="1"/>
    <line x1="179" y1="86" x2="185" y2="86" stroke-width="1"/>
    <line x1="191" y1="86" x2="197" y2="86" stroke-width="1"/>
    <line x1="179" y1="95" x2="185" y2="95" stroke-width="1"/>
    <line x1="191" y1="95" x2="197" y2="95" stroke-width="1"/>

    <!-- dB scale markers -->
    <text x="204" y="34" fill="currentColor" font-family="monospace" font-size="6.5">+3dB</text>
    <text x="204" y="60" fill="currentColor" font-family="monospace" font-size="6.5">0dB</text>
    <text x="204" y="102" fill="currentColor" font-family="monospace" font-size="6.5">-inf</text>

    <!-- Waveform curve along bottom -->
    <path d="M 20 120 Q 35 110, 50 120 T 80 120 T 110 120 T 140 120 T 170 120 T 200 120" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- Bottom Caption -->
    <text x="20" y="134" fill="currentColor" font-family="monospace" font-size="7.5" letter-spacing="0.08em">
      AUDIO ENGINE · 48kHz 32-BIT
    </text>
  </g>
</svg>
