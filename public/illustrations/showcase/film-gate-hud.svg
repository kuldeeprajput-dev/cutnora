<svg viewBox="0 0 240 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 35mm Film Strip Track -->
    <rect x="15" y="12" width="210" height="56" rx="3" stroke-width="1.4"/>

    <!-- Sprocket holes along top and bottom -->
    <rect x="22" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="22" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="42" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="42" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="62" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="62" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="82" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="82" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="102" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="102" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="122" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="122" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="142" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="142" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="162" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="162" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="182" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="182" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="202" y="16" width="8" height="6" rx="1" stroke-width="0.8"/>
    <rect x="202" y="58" width="8" height="6" rx="1" stroke-width="0.8"/>

    <!-- Center Frame Gate Crosshair -->
    <circle cx="120" cy="40" r="15" stroke-dasharray="2 3"/>
    <line x1="120" y1="30" x2="120" y2="50" stroke-width="1.2"/>
    <line x1="110" y1="40" x2="130" y2="40" stroke-width="1.2"/>

    <!-- Optical Audio Track lines -->
    <line x1="20" y1="28" x2="220" y2="28" stroke-dasharray="1 3" stroke-width="0.8"/>

    <!-- SMPTE Timecode Display -->
    <text x="15" y="88" fill="currentColor" font-family="monospace" font-size="8.5" letter-spacing="0.08em">
      SMPTE 00:08:07:12
    </text>
    <text x="15" y="102" fill="currentColor" font-family="monospace" font-size="7.5" letter-spacing="0.08em">
      23.976 FPS · SUB-FRAME SYNC
    </text>
  </g>
